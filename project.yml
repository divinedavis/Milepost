name: Milepost
options:
  bundleIdPrefix: com.divinedavis
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "11"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

configs:
  Debug: debug
  Release: release

packages:
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: "2.20.0"

targets:
  Milepost:
    type: application
    platform: iOS
    # XcodeGen has no target-level `resources:` key — a folder listed there is
    # silently dropped from the bundle. Resources/ rides along under sources.
    sources:
      - path: Milepost
    # The friends layer's Supabase project. Gitignored; a clone without it
    # builds fine and the Friends feed says it is unavailable.
    configFiles:
      Debug: Secrets.xcconfig
      Release: Secrets.xcconfig
    info:
      path: Milepost/Info.plist
      properties:
        CFBundleDisplayName: Milepost
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
          UIImageRespectsSafeAreaInsets: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiredDeviceCapabilities:
          - arm64
          - gps
        ITSAppUsesNonExemptEncryption: false
        CFBundleIconName: AppIcon
        # Location keeps the process alive while the screen is off mid-run.
        # Without this key, allowsBackgroundLocationUpdates traps at runtime.
        # Audio lets the voice cues play with the screen off: without it the
        # playback session refuses to activate in the background (silently).
        UIBackgroundModes:
          - location
          - audio
        NSLocationWhenInUseUsageDescription: Milepost uses your location to measure distance and pace and to draw your route while you run, including while the screen is off.
        # The Dynamic Island / lock-screen run card. Without this key
        # Activity.request throws and the run simply has no card.
        NSSupportsLiveActivities: true
        # Health. Both keys are required the moment the app links HealthKit:
        # the share string is shown when Milepost asks to write workouts, the
        # read string when it asks for heart rate and body mass. A missing
        # string is a launch-time crash, not a warning.
        NSHealthUpdateUsageDescription: Milepost adds your saved runs, walks and rides to Apple Health as workouts, so they count toward your rings and other fitness apps can read them. Your route is only included if you switch it on.
        NSHealthShareUsageDescription: Milepost reads heart rate and other metrics your Apple Watch recorded during an activity, and your weight, so it can estimate calories more accurately.
        # Supabase project for friends. The anon key is public by design (it
        # ships in the bundle); RLS does the gating. From Secrets.xcconfig.
        SUPABASE_HOST: $(SUPABASE_HOST)
        SUPABASE_ANON_KEY: $(SUPABASE_ANON_KEY)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.divinedavis.milepost
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_EMIT_LOC_STRINGS: YES
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: CG89RY4W6R
        ENABLE_PREVIEWS: YES
        # Without this the AccentColor.colorset is dead weight and every .tint
        # falls back to system blue.
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    entitlements:
      path: Milepost/Milepost.entitlements
      properties:
        # APPLE_ID_AUTH is enabled on the identifier (scripts/asc_enable_capability.py);
        # the entitlement and the capability are two halves of one switch.
        com.apple.developer.applesignin:
          - Default
        com.apple.developer.healthkit: true
    dependencies:
      - target: MilepostWidget
      - target: MilepostWatch
        embed: true
      - package: Supabase
        product: Supabase

  # The Live Activity is drawn by a widget extension; the app only feeds it.
  # The three shared files are compiled into both targets on purpose: the
  # extension cannot link the app.
  MilepostWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: MilepostWidget
      - path: Milepost/Models/RunActivityAttributes.swift
      - path: Milepost/Models/Units.swift
      - path: Milepost/Models/Sport.swift
      - path: Milepost/Models/RunActivityIntents.swift
      - path: Milepost/Design/Theme.swift
      - path: Milepost/Design/SportIcon.swift
    info:
      path: MilepostWidget/Info.plist
      properties:
        CFBundleDisplayName: Milepost
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.divinedavis.milepost.widget
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: CG89RY4W6R
        SKIP_INSTALL: YES

  # The watch app records standalone: its own HKWorkoutSession for heart rate
  # and for staying alive with the wrist down, its own GPS, and the app's own
  # RunRecorder for distance, pace and splits so the two devices cannot
  # disagree about the same run. The shared files below are compiled into it
  # for the same reason the widget compiles its three: a watch app cannot link
  # the iPhone app.
  MilepostWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: MilepostWatch
      - path: Milepost/Models/Sport.swift
      - path: Milepost/Models/Units.swift
      - path: Milepost/Models/RoutePoint.swift
      - path: Milepost/Models/VoiceCue.swift
      - path: Milepost/Models/HealthSettings.swift
      - path: Milepost/Models/WatchActivityPayload.swift
      - path: Milepost/Models/WorkoutRemoteCommand.swift
      - path: Milepost/Services/RunRecorder.swift
      - path: Milepost/Services/CalorieEstimator.swift
      - path: Milepost/Services/SplitTimeline.swift
      - path: Milepost/Services/Sport+HealthKit.swift
      - path: Milepost/Design/Theme.swift
      - path: Milepost/Design/SportIcon.swift
    info:
      path: MilepostWatch/Info.plist
      properties:
        CFBundleDisplayName: Milepost
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        # Single-target watch app (no legacy WatchKit extension).
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.divinedavis.milepost
        # The watch app records on its own; it must not need the phone nearby.
        WKRunsIndependentlyOfCompanionApp: true
        # workout-processing is what keeps the app running with the wrist down;
        # without it the session is suspended and the run stops. location is
        # what allowsBackgroundLocationUpdates requires, exactly as on iOS.
        UIBackgroundModes:
          - workout-processing
          - location
        NSHealthUpdateUsageDescription: Milepost saves your runs, walks and rides to Apple Health as workouts, with heart rate and calories from your watch.
        NSHealthShareUsageDescription: Milepost reads the heart rate and calories your watch measures during an activity so it can show them while you move.
        NSLocationWhenInUseUsageDescription: Milepost uses your location to measure distance and pace and to record your route while you move, including with your wrist down.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.divinedavis.milepost.watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: CG89RY4W6R
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    entitlements:
      path: MilepostWatch/MilepostWatch.entitlements
      properties:
        com.apple.developer.healthkit: true

  MilepostTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MilepostTests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.divinedavis.milepost.tests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Milepost

  MilepostUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: MilepostUITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.divinedavis.milepost.uitests
        GENERATE_INFOPLIST_FILE: YES
    dependencies:
      - target: Milepost

schemes:
  Milepost:
    build:
      targets:
        Milepost: all
        MilepostTests: [test]
        MilepostUITests: [test]
    test:
      targets:
        - MilepostTests
        - MilepostUITests
      gatherCoverageData: true
    run:
      config: Debug
    archive:
      config: Release
